# ============================================================================== #
#                                                                                #
#                T R U T H F U L   A N T I - C H E A T   C H E C K S              #
#                                                                                #
#   Everything detection-related lives here: per-check toggles, lagback VLs,    #
#   punishment thresholds and commands, banwave routing, and the special        #
#   per-type tuning keys (e.g. AUTOCLICKER.max_cps).                            #
#                                                                                #
#   Per-check keys:                                                              #
#     enabled   - master switch for the check.                                   #
#     lagback   - position correction ("inherit" | true | false).                #
#     cancel    - direct packet rejection switch (default true). ONLY applies    #
#                 to checks that reject packets outright (Crasher, BadPacket     #
#                 slot/spectate, BedrockReach). false = observe-only: the check  #
#                 still flags and alerts but lets the packet through. Punishment  #
#                 and lagback switches never covered packet rejection - this is  #
#                 the explicit switch for it.                                    #
#                                                                                #
#   Plugin-wide settings (alerts, messages, discord, banwave schedule)         #
#   live in config.yml.                                                          #
# ============================================================================== #

checks:

  # ---------------------------------------------------------------------------- #
  # --- BEDROCK & GEYSER PLATFORM CHECKS ---------------------------------------- #
  # Custom checks for Geyser/Floodgate Bedrock edition players who have different #
  # touch mechanics, higher natural reach, and unique physics translation.      #
  # ---------------------------------------------------------------------------- #
  BEDROCK:
    # BSpeed(A) - Bedrock players move weird through Geyser, so they get thier own speed check.
    A:
      enabled: true
      lagback: inherit
      lagback-vl: 15
      punishment:
        enabled: true
        vl: 50
        command: "kick %player% [Truthful] Speed"
        banwave: false
    # BFly(A) - Same deal but for flying. Seperate thresholds, don't mix them with Java.
    B:
      enabled: true
      lagback: inherit
      lagback-vl: 15
      punishment:
        enabled: true
        vl: 50
        command: "kick %player% [Truthful] Fly"
        banwave: false
    # BReach(A) - Touch controls get extra reach. Don't @ me, that's just how Bedrock is.
    C:
      enabled: true
      lagback: inherit
      lagback-vl: 15
      punishment:
        enabled: true
        vl: 50
        command: "kick %player% [Truthful] Reach"
        banwave: false

  # ---------------------------------------------------------------------------- #
  # --- SIMULATION - UNIFIED MOTION PHYSICS -------------------------------------- #
  # One engine, one verdict. Simulates vanilla movement for every legal input    #
  # each tick and measures the smallest possible deviation from what the client  #
  # reported. Replaces the old SimulationA-E / VectorA-C suites.                 #
  # ---------------------------------------------------------------------------- #
  SIMULATION:
    # Lagback: "inherit" pulls the global lagback profile (movement checks on,
# others off); true/false force this check. Example override below Simulation.
    # Engine architecture credited to Grim Anti-Cheat (clean-room implementation).
    A:
      enabled: true
      lagback-vl: 35
      punishment:
        enabled: true
        vl: 350
        command: "kick %player% Unfair Advantage"
        banwave: false

  # ---------------------------------------------------------------------------- #
  # --- VELOCITY & KNOCKBACK CHECKS ---------------------------------------------- #
  # Verifies player response to server knockback, explosions, and damage forces   #
  # using transactional network handshake pairs.                                #
  # ---------------------------------------------------------------------------- #
  VELOCITY:
    # Velocity(A) - Did the knockback actually move them? Catches 0% KB,
    # partial KB, and reverse KB. Bread and butter, leave it on.
    A:
      enabled: true
      lagback: inherit
      lagback-vl: 10
      punishment:
        enabled: true
        vl: 150
        command: "kick %player% Unfair Advantage"
        banwave: false
    # Velocity(B) - Vertical KB check. Eats jump-resets and anti-lift for breakfast.
    B:
      enabled: true
      lagback: inherit
      lagback-vl: 10
      punishment:
        enabled: true
        vl: 150
        command: "kick %player% Unfair Advantage"
        banwave: false
    # Velocity(C) - Takes the KB then slams the brakes on tick 2. Classic move.
    C:
      enabled: true
      lagback: inherit
      lagback-vl: 10
      punishment:
        enabled: true
        vl: 150
        command: "kick %player% Unfair Advantage"
        banwave: false
    # Velocity(D) - Holds velocity packets hostage to delay the KB. Shitty trick, easy catch.
    D:
      enabled: true
      lagback: inherit
      lagback-vl: 10
      punishment:
        enabled: true
        vl: 150
        command: "kick %player% Unfair Advantage"
        banwave: false

  # ---------------------------------------------------------------------------- #
  # --- GROUND SPOOF & NOFALL CHECKS --------------------------------------------- #
  # Validates player ground state claims against physical block collision maps.   #
  # ---------------------------------------------------------------------------- #
  SPOOF:
    # GroundSpoof(B) - Claimed-ground Y must sit on the collision grid
    # (multiples of 1/16). Logical fallback bug fixed; no longer dead.
    B:
      enabled: true
      lagback:
      punishment:
        enabled: false
        vl: 100
        command: "kick %player% Unfair Advantage"
        banwave: false
    # GroundSpoof(C) - Claims ground while falling out of the sky. Yeah right.
    C:
      enabled: true
      lagback: inherit
      lagback-vl: 5
      punishment:
        enabled: true
        vl: 100
        command: "kick %player% Unfair Advantage"
        banwave: false
    # GroundSpoof(D) - Claims ground below the damn void. Instant tell.
    D:
      enabled: true
      lagback:
      punishment:
        enabled: true
        vl: 100
        command: "kick %player% Unfair Advantage"
        banwave: false
    # GroundSpoof(E) - Fall distance reset games. Oldest NoFall trick in the book.
    E:
      enabled: true
      lagback:
      punishment:
        enabled: true
        vl: 150
        command: "kick %player% Unfair Advantage"
        banwave: false
    # GroundSpoof(F) - Actually looks at the blocks under them. Boring but reliable.
    F:
      enabled: true
      lagback: inherit
      lagback-vl: 5
      punishment:
        enabled: true
        vl: 150
        command: "kick %player% Unfair Advantage"
        banwave: false
    # GroundSpoof(G) - Sends ground=true without even moving. Lazy NoFall modules do this.
    G:
      enabled: true
      lagback: inherit
      lagback-vl: 5
      punishment:
        enabled: true
        vl: 150
        command: "kick %player% Unfair Advantage"
        banwave: false

  # ---------------------------------------------------------------------------- #
  # --- GAME SPEED & TIMER CHECKS ------------------------------------------------ #
  # Analyzes nanosecond network clock balance to detect game speed acceleration.  #
  # ---------------------------------------------------------------------------- #
  TIMER:
    # Timer(A) - Counts packets against the clock. Timer users stick out fast.
    A:
      enabled: true
      lagback: inherit
      lagback-vl: 5
      punishment:
        enabled: true
        vl: 20
        command: "kick %player% Unfair Advantage"
        banwave: false

  # ---------------------------------------------------------------------------- #
  # --- KILLAURA & COMBAT AUTOMATION CHECKS -------------------------------------- #
  # Analyzes combat patterns, target switching, wall-hitting, and attack order. #
  # ---------------------------------------------------------------------------- #
  KILLAURA:
    # KillAura(B) - Keeps sprinting straight through hits. Real players slow down, cheaters dont.
    B:
      enabled: true
      lagback: inherit
      lagback-vl: 15
      punishment:
        enabled: false
        vl: 50
        command: "kick %player% Unfair Advantage"
        banwave: false
    # KillAura(C) - Snaps to a target then stops dead. Looks robotic because it is.
    C:
      enabled: true
      lagback: inherit
      lagback-vl: 15
      punishment:
        enabled: false
        vl: 50
        command: "kick %player% Unfair Advantage"
        banwave: false
    # KillAura(D) - Rotations the server never sees (silent aim) plus pitch locks.
    D:
      enabled: true
      lagback: inherit
      lagback-vl: 5
      punishment:
        enabled: true
        vl: 15
        command: "kick %player% Unfair Advantage"
        banwave: false
    # Wall hit detection. Smacking people through walls. Dumb and detectable.
    E:
      enabled: true
      lagback: inherit
      lagback-vl: 5
      punishment:
        enabled: true
        vl: 15
        command: "kick %player% Unfair Advantage"
        banwave: false
    # Packet criticals. Those tiny fake hops for free crits mid-fight.
    F:
      enabled: true
      lagback: inherit
      lagback-vl: 5
      punishment:
        enabled: true
        vl: 15
        command: "kick %player% Unfair Advantage"
        banwave: false
    # KillAura(G) - Swaps targets faster than any human hand could. Mosh pit beware though.
    G:
      enabled: true
      lagback: inherit
      lagback-vl: 5
      punishment:
        enabled: true
        vl: 15
        command: "kick %player% Unfair Advantage"
        banwave: false
    # KillAura(H) - Attack rhythm too perfect to be a hand. Machines click even, humans dont.
    H:
      enabled: true
      lagback: inherit
      lagback-vl: 10
      punishment:
        enabled: false
        vl: 50
        command: "kick %player% Unfair Advantage"
        banwave: false

  # ---------------------------------------------------------------------------- #
  # AIM CHECKS - intentionally minimal (free plugin).                            #
  # Three basic GCD variants only: enough to catch shitty / somewhat decent     #
  # aim assist, not enough to hand cheat devs a bypass spec.                    #
  # ---------------------------------------------------------------------------- #
  AIM:
    # Aim(A) - Basic GCD validity (rotation step maps to a real sensitivity).
    A:
      enabled: true
      lagback:
      punishment:
        enabled: false
        vl: 50
        command: "kick %player% Unfair Advantage"
        banwave: false
    # Aim(B) - Basic grid snap (valid step, but rotations land off-grid).
    B:
      enabled: true
      lagback:
      punishment:
        enabled: false
        vl: 50
        command: "kick %player% Unfair Advantage"
        banwave: false
    # Aim(C) - Basic constant rotation (identical yaw corrections while fighting).
    C:
      enabled: true
      lagback:
      punishment:
        enabled: false
        vl: 50
        command: "kick %player% Unfair Advantage"
        banwave: false

  # ---------------------------------------------------------------------------- #
  # --- AUTOCLICKER CHECKS ------------------------------------------------------- #
  # Analyzes left-click animation packets for statistical patterns, CPS caps,    #
  # double-clicks, and GCD grid locking.                                         #
  # ---------------------------------------------------------------------------- #
  AUTOCLICKER:
    max_cps: 22
    count_ground_punches: false
    # AutoClicker(A) - Clicks too consistent to be a finger. Stats don't lie.
    A:
      enabled: true
      lagback:
      punishment:
        enabled: false
        vl: 50
        command: "kick %player% Unfair Advantage"
        banwave: false
    # AutoClicker(B) - Same exact delay over and over. Nobody clicks like that.
    B:
      enabled: true
      lagback:
      punishment:
        enabled: false
        vl: 50
        command: "kick %player% Unfair Advantage"
        banwave: false
    # Hard CPS cap (see max_cps above). Past it = not human. Simple as.
    C:
      enabled: true
      lagback:
      punishment:
        enabled: false
        vl: 50
        command: "kick %player% Unfair Advantage"
        banwave: false
    # AutoClicker(D) - Double-clicks faster than hardware should allow. Under 8ms, sus.
    D:
      enabled: true
      lagback:
      punishment:
        enabled: false
        vl: 50
        command: "kick %player% Unfair Advantage"
        banwave: false
    # Click delays sitting on a grid = macro timing. Hands don't do grids.
    E:
      enabled: true
      lagback:
      punishment:
        enabled: false
        vl: 50
        command: "kick %player% Unfair Advantage"
        banwave: false

  # ---------------------------------------------------------------------------- #
  # HITBOX & REACH CHECKS - simple, no ping backtrack by design.                 #
  # Single eye + single ray + latest snapshot. Lenient on purpose so lag        #
  # without compensation can't false flag. Catches blatant abuse, not subtle.   #
  # ---------------------------------------------------------------------------- #
  HITBOX:
    # Hitbox(A) - Aiming nowhere near the body but landing hits anyway. Blatant stuff only.
    A:
      enabled: true
      lagback: inherit
      lagback-vl: 5
      punishment:
        enabled: false
        vl: 65
        command: "kick %player% Unfair Advantage"
        banwave: false

  REACH:
    # Reach(A) - Hitting from too far away. Lenient on purpose so lag can't false it.
    A:
      enabled: true
      lagback: inherit
      lagback-vl: 10
      punishment:
        enabled: false
        vl: 65
        command: "kick %player% Unfair Advantage"
        banwave: false

  # ---------------------------------------------------------------------------- #
  # --- CRYSTAL & ANCHOR AURA CHECKS ---------------------------------------------- #
  # Fast place-to-break speed and zero-tick ID prediction macros.                #
