        banwave: false

  # ---------------------------------------------------------------------------- #
  # --- LAG & LATENCY ABUSE CHECKS ----------------------------------------------- #
  # Backtrack assist, entity desync, and Spearman rank ping-correlation.        #
  # ---------------------------------------------------------------------------- #
  LAG:
    # Lag(A) - Hits you where you were half a second ago. Backtrack, basically.
    A:
      enabled: true
      lagback: inherit
      lagback-vl: 10
      punishment:
        enabled: false
        vl: 50
        command: "kick %player% Unfair Advantage"
        banwave: false
    # Lag(B) - Abuses entity interpolation to reach further. Sneaky-ish one.
    B:
      enabled: true
      lagback: inherit
      lagback-vl: 10
      punishment:
        enabled: false
        vl: 50
        command: "kick %player% Unfair Advantage"
        banwave: false
    # Lag(C) - Compares ping vs flags over time. Slow burn, don't expect instant results.
    C:
      enabled: true
      lagback: inherit
      lagback-vl: 10
      punishment:
        enabled: false
        vl: 50
        command: "kick %player% Unfair Advantage"
        banwave: false

  # ---------------------------------------------------------------------------- #
  # --- SCAFFOLD & BRIDGING AUTOMATION CHECKS ------------------------------------ #
  # Four geometry/physics-anchored detections: placement line-of-sight,          #
  # placement reach, tower metronome physics, and occupied-cell placement.      #
  # ---------------------------------------------------------------------------- #
  SCAFFOLD:
    # Scaffold(A) "Rotation" - places a block their camera genuinely cannot see.
    # Rotation-less and aim-assist placement fail the eye->face ray test; godbridge
    # and telly pass because their rays really do intersect (0.10 expansion).
    A:
      enabled: true
      lagback: inherit
      lagback-vl: 5
      punishment:
        enabled: true
        vl: 20
        command: "kick %player% Unfair Advantage"
        banwave: false
    # Scaffold(B) "Reach" - places blocks from beyond the block interaction range.
    # Attribute-aware (creative/modified ranges respected) + 0.25 jitter allowance.
    B:
      enabled: true
      lagback: inherit
      lagback-vl: 5
      punishment:
        enabled: true
        vl: 20
        command: "kick %player% Unfair Advantage"
        banwave: false
    # Scaffold(C) "Motion" - tower metronome physics. Legit jump-towering needs a
    # full jump arc per level; cheats place faster. Jump-strength-scaled threshold
    # so Jump Boost users never false.
    C:
      enabled: true
      lagback: inherit
      lagback-vl: 8
      punishment:
        enabled: true
        vl: 30
        command: "kick %player% Unfair Advantage"
        banwave: false
    # Scaffold(D) "Face" - places INTO an already-occupied solid cell
    # (ghost/desync placement). Skips replaceable/liquid targets.
    D:
      enabled: true
      lagback: inherit
      lagback-vl: 5
      punishment:
        enabled: true
        vl: 25
        command: "kick %player% Unfair Advantage"
        banwave: false

  # ---------------------------------------------------------------------------- #
  # --- WORLD, PHASE & FAST BREAK CHECKS ----------------------------------------- #
  # ---------------------------------------------------------------------------- #
  PHASE:
    # Phase(A) - Standing inside solid blocks. Off by default, still too trigger-happy.
    A:
      enabled: false
      lagback: inherit
      lagback-vl: 5
      punishment:
        enabled: false
        vl: 50
        command: "kick %player% Unfair Advantage"
        banwave: false

  FAST_BREAK:
    # FastBreak(A) - Breaks blocks faster than the tool allows. Does the math per block.
    A:
      enabled: true
      lagback:
      punishment:
        enabled: true
        vl: 10
        command: "kick %player% Unfair Advantage"
        banwave: false

  RAYCAST:
    # Raycast(A) - Interacts with blocks it can't see or reach. Off for now, noisy.
    A:
      enabled: false
      lagback:
      punishment:
        enabled: true
        vl: 15
        command: "kick %player% Unfair Advantage"
        banwave: false

  # ---------------------------------------------------------------------------- #
  # --- PACKET INTEGRITY & PROTOCOL EXPLOIT CHECKS -------------------------------- #
  # ---------------------------------------------------------------------------- #
  # Numbers, then letters. No D, it was blank. Most are order and sanity
  # checks no legit client trips. If one annoys you, dissable that one letter.
  # Direct-rejecting letters (O, Q, Z - hotbar slots, spectate) honor the
  # per-check "cancel" switch: cancel: false makes them observe-only.
  BAD_PACKET:
    # BadPacket(5) - Bad block places. Null face or clicks outside the block.
    5:
      enabled: true
      lagback:
      punishment:
        enabled: false
        vl: 20
        command: "kick %player% Unfair Advantage"
        banwave: false
    # BadPacket(6) - Bad dig order. Finishing digs that never started.
    6:
      enabled: true
      lagback:
      punishment:
        enabled: false
        vl: 20
        command: "kick %player% Unfair Advantage"
        banwave: false
    # BadPacket(8) - Digging blocks way out of reach. Nukers guessing positions.
    8:
      enabled: true
      lagback:
      punishment:
        enabled: false
        vl: 20
        command: "kick %player% Unfair Advantage"
        banwave: false
    # BadPacket(A) - Flying without the server ever allowing it. Spoofed abilities.
    A:
      enabled: true
      lagback: inherit
      lagback-vl: 5
      punishment:
        enabled: false
        vl: 20
        command: "kick %player% Unfair Advantage"
        banwave: false
    # BadPacket(B) - Flying-only packets 20+ in a row while moving. Positions got eaten.
    B:
      enabled: true
      lagback:
      punishment:
        enabled: false
        vl: 20
        command: "kick %player% Unfair Advantage"
        banwave: false
    # BadPacket(D) - Duplicate sprint/sneak state. Real clients transition once.
    D:
      enabled: true
      lagback:
      punishment:
        enabled: false
        vl: 10
        command: "kick %player% Unfair Advantage"
        banwave: false
    # BadPacket(E) - Interacted with themselves. Attacking your own entity ID.
    E:
      enabled: true
      lagback:
      punishment:
        enabled: false
        vl: 20
        command: "kick %player% Unfair Advantage"
        banwave: false
    # BadPacket(F) - Non-finite rotations. NaN or infinite yaw/pitch.
    F:
      enabled: true
      lagback:
      punishment:
        enabled: false
        vl: 10
        command: "kick %player% Unfair Advantage"
        banwave: false
    # BadPacket(G) - Positions outside the world. Deep void or past build limit.
    G:
      enabled: true
      lagback: inherit
      lagback-vl: 1
      punishment:
        enabled: false
        vl: 10
        command: "kick %player% Unfair Advantage"
        banwave: false
    # BadPacket(H) - Attack order burst. Different target every few ms is multi-aura.
    H:
      enabled: true
      lagback:
      punishment:
        enabled: false
        vl: 20
        command: "kick %player% Unfair Advantage"
        banwave: false
    # BadPacket(I) - Impossible position claims. A position packet that jumps
    # teleport-distance with no teleport explaining it exists to force server
    # corrections - the "far position packet" disabler. Rejected at the door
    # (server never sees it, trackers never adopt it) and flagged.
    # cancel: false = observe-only (flags still stream, packets pass through).
    I:
      enabled: true
      lagback:
      cancel: true
      punishment:
        # Off by default: a single plugin/server teleport we failed to match
        # could otherwise kick a legitimate player. Admins can enable it.
        enabled: false
        vl: 5
        command: "kick %player% [Truthful] Packet Abuse"
        banwave: false
    # BadPacket(J) - Swaps hotbar slots right as blocks go down. Auto-tool shuffle.
    J:
      enabled: true
      lagback:
      punishment:
        enabled: false
        vl: 20
        command: "kick %player% Unfair Advantage"
        banwave: false
    # BadPacket(K) - Entity action spam. Same action twice in 20ms, or 30+ a second.
    K:
      enabled: true
      lagback:
      punishment:
        enabled: false
        vl: 20
        command: "kick %player% Unfair Advantage"
        banwave: false
    # BadPacket(L) - Teleport flood. Forces server corrections to farm exemptions.
    L:
      enabled: true
      lagback:
      punishment:
        enabled: false
        vl: 20
        command: "kick %player% Unfair Advantage"
